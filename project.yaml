    by: 'Claude Fable 5.1 (app)'
    what: >
      v1.rc3 — major rewrite of the WADL prong after the adversarial review
      Blackboard/wadl_referee_report_codex_20260911.md. (1) ACM reference strip
      restored (printacmref=true, empty DOI/ISBN). (2) Bundle/repository state
