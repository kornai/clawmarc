# ClawXiv project metadata — canonical, hand-maintained
schema_version: 1
slug: clawmarc
title: 'The 4096-byte catalog card: fixed-size, signed, content-bound description for archives that machines read'
format_name: clawmarc          # public name of the format; wire magic stays CXCC
root_tex: clawmarc.tex        # clawxiv-ready prong (joint authorship)
submit_tex: clawmarc_wadl.tex # reviewer-facing prong (AK sole author, AI in acknowledgments)
bib: clawmarc.bib
status: draft
version: v1.rc3
created: 2026-09-07
layout_version: '1.3'   # arena_class 16-27 = DCMI Type Vocabulary (AK ruling 2026-09-07)

venue:
  name: 'Web Archiving and Digital Libraries Workshop (WADL 2026), with JCDL 2026'
  place: 'Dallas, TX, USA (hybrid)'
  date: 2026-10-16
  deadline: 2026-09-16
  notification: 2026-10-01
  portal: 'https://easychair.org/conferences/?conf=wadl2026'
  cfp: 'https://wadlworkshop.github.io/2026/content/0-cfp/'
  type: 'short paper (2+ pages, ACM sigconf)'

spec:
  internet_draft: draft-kornai-clawmarc-00
  datatracker: 'https://datatracker.ietf.org/doc/draft-kornai-clawmarc/'
  uploaded: 2026-06-24
  expires: 2026-12-25
  ise_outcome: 'declined for the Independent Submission stream (Eliot Lear, ISE); state change on Datatracker 2026-09-01'
  staged_revision: draft-kornai-clawmarc-02 (layout 1.3, DCMI classes; not uploaded)
  github: 'https://github.com/kornai/clawmarc'   # mirrors the bundle layout since v1.rc3, commit 76d8c2d (2026-09-12); archives excluded

origin: >
  Split off 2026-09-07 from ~/Proj/SW/ClawXiv/clawmarc (public bundle rc1,
  2026-06-23) and ~/Proj/SW/ClawXiv/clawmarc-github (GitHub checkout with
  draft -01 and LibAngel policy hooks, 2026-06-28). Originals left in place.
  Design history: ClawXiv Blackboard (rfc/RFC_CXCC_0001*), LibAngel Blackboard
  (2026-06-22/23 differential test, rc1 layout, RFC submission plans).

bundle_convention: >
  The project directory IS the bundle layout; releases are tarball snapshots
  generated at signing time (recipe in README.md). No standing staging copy.
  MANIFEST.sha256 exists only inside snapshots.

two_prong_convention: >
  Reviewer-facing (clawmarc_wadl.tex, acmart, BibTeX ACM-Reference-Format as
  acmart requires) and clawxiv-ready (clawmarc.tex, clawxiv.sty, biblatex)
  TeX are separate parallel files, synced by hand. Never refactor into shared
  \input bodies.

versioning_convention: >
  Internal review candidates: vN.rcM (provenance-logged, not pushed publicly).
  Clean major label vN assigned only after all parties sign the bundle.

authors:
  - 'András Kornai'
  - 'Claude Fable 5.1 (Anthropic)'

ai_authors:
  - 'Claude Fable 5.1 (Anthropic)'

