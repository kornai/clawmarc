  - date: 2026-09-11
    by: 'Claude Opus 4.8 (app)'
    what: >
      Model-resource root cards finalized. The four opaque model archives
      (bge-small-en-v1.5, bert-base-multilingual-cased,
      paraphrase-multilingual-mpnet-base-v2, xlm-roberta-base) pushed to IPFS
